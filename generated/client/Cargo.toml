[package]
name = "client"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
shared_types = {workspace=true}
bitcode = { workspace = true }
interprocess = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["io-util", "rt", "rt-multi-thread"] }

[build-dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0.118", features = ["full"] }
prettyplease = "0.2.37"
