[package]
name = "catbox"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "deflate", "charset"] }
scraper = "0.27.0"
shared_types = { workspace = true }
client = { workspace = true }
tokio = { version = "1.52.3", features = ["rt", "time"] }
