[package]
name = "thumbnailer"
readme = "README.md"
license = "Apache-2.0"
authors = ["trivernis <trivernis@protonmail.com>"]
description = "An image thumbnail creation library"
version = "0.5.1"
edition = "2024"
repository = "https://github.com/Trivernis/thumbnailer"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
webp = "*"
#rayon = "*"
tempfile = "*"
image = { version = "*", default-features = false, features=["jpeg", "png", "gif"]}
lazy_static = "*"
file-format = { workspace = true }
#video-rs = { version = "0.11.0", features = ["ndarray"] }
#ndarray = "0.17.2"
webp-animation = "0.10.0"
#sha2 = "0.11.0"
#ffmpeg-next = "8.1.0"
avio = {git = "https://github.com/git4unrealnondev/avio", default-features = false, features=["decode"]}
ff-sys = { git = "https://github.com/git4unrealnondev/avio" }
#ff-format = "0.15.0"
[features]
default = ["webp"]
webp = ["image/webp"]
