[package]
name = "tor-serve"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"] 

[dependencies]
shared_types = { workspace = true }
client = { workspace = true }
anyhow = "1.0.75"
arti-client = { version = "0.45", features = [
    "onion-service-service",
] }
axum = { version = "0.8.1", features = ["json", "macros", "tracing"] }
futures = "0.3.14"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1.1", features = ["tokio"] }
safelog = {  version = "0.9" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tor-cell = {  version = "0.45" }
tor-hsservice = {  version = "0.45" }
tor-proto = {  version = "0.45" }
tower = { version = "0.5.1", features = ["util", "tracing"] }
tower-http = { version = "0.7.0", features = ["fs"] }
tracing-subscriber = "0.3.20"
serde_json = "1.0.151"


