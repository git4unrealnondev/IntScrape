[package]
name = "intscrape"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
default-run = "intscrape"

[dependencies]
fast_log = "1.7.8"
log = "0.4.33"
reqwest = { version = "0.13.5", default-features = false, features = ["cookies", "gzip", "deflate", "charset", "http2", "rustls"] }
tokio = { workspace = true, features = ["macros", "fs", "signal"] }
shared_types = { workspace = true, features = ["strum"] }
libloading = "0.9.0"
parking_lot = "0.12.5"
serde_json = "1.0.150"
url = "2.5.8"
clap = { version = "4.6.1", features = ["derive"] }
governor = "0.10.4"
bytes = "1.12.0"
file-format = { workspace = true }
sha2 = "0.11.0"
sha1 = "0.11.0"
md5 = "0.8.0"
hex = "0.4.3"
rayon = "1.12.0"
interprocess = { workspace = true }
client = { workspace = true }
ipc_macro = { path = "./libs/ipc_macro" }
rand = "0.10.1"
cfg-if = "1.0.4"
libc = "0.2.186"
dhat = { version = "0.3.3", optional = true }
tempfile = "3.27.0"
walkdir = "2.5.0"
jwalk = "0.9.0"
memmap2 = "0.9.11"
ctrlc = "3.5.2"
regex = "1.13.1"
strum = "0.28.0"
image_hasher = "3.1.1"
# Only the codecs that actually occur in scraped media. The defaults pull in
# `ravif`/`rav1e` (an AV1 *encoder*; AVIF cannot be decoded without the
# non-default `avif-native` anyway), OpenEXR (`exr`), and HDR/DDS/PNM/QOI/
# farbfeld support. Undecodable formats already degrade gracefully in the
# hashing paths (`.ok()?` / `if let Ok`).
image = { version = "0.25.10", default-features = false, features = ["rayon", "jpeg", "png", "gif", "webp", "bmp", "ico", "tga", "tiff"] }
# Priority-ordered async semaphore for the download and job concurrency
# gates. Higher job priority is granted first, equal priority is FIFO.
# Runtime-agnostic, so it works on tokio without pinning a runtime.
priority-semaphore = "0.2.0"
turso = { version = "=0.8.2", default-features = false, features = ["fts"] }
smol_str = "0.3.6"

# Reserved for the rusqlite-backed legacy backend in src/db/old_code, which is
# gated behind `#[cfg(feature = "legacy")]`. That feature is currently
# undefined, so none of these are ever compiled; they stay here so the legacy
# backend can be revived without re-deriving its dependency set.
roaring = { version = "0.11.4", optional = true }
intmap = { version = "3.1.3", optional = true }
strsim = { version = "0.11.1", optional = true }
nohash-hasher = { version = "0.2.0", optional = true }

[workspace.dependencies]
shared_types = { path = "./libs/shared_types" }
client = { path = "./generated/client" }
file-format = { version = "0.29.0", features = ["reader"] }
serde = { version = "1.0.228", features = ["derive"] }
interprocess = { version = "2.4.2", features = ["tokio"] }
bitcode = "0.6.9"
tokio = { version = "1.52.3", default-features = false, features = ["io-util", "rt", "rt-multi-thread", "time"] }
strum_macros = "0.28.0"
strum = "0.28.0"

[workspace]
members = [
    "plugins/*",
    "libs/shared_types",
    "libs/ipc_macro",
    "generated/client",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"

[profile.release]
opt-level = 3
# `lto = "fat"` + `codegen-units = 1` serialized nearly the whole build: fat
# LTO's optimization pass is single-threaded and runs once per linked artifact
# (the main binary plus every plugin), and one codegen unit disables parallel
# codegen inside each crate. Thin LTO keeps most of the cross-crate inlining
# while parallelizing, and 16 codegen units restore intra-crate parallelism.
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true

# Opt-in maximum-performance profile for final production builds where the
# last percent of runtime speed is worth a much longer compile time:
# `cargo build --profile release-max -p intscrape`
[profile.release-max]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

[features]
dhat-heap = ["dep:dhat"]   # if you are doing heap profiling
dhat-ad-hoc = ["dep:dhat"] # if you are doing ad hoc profiling

[dev-dependencies]
# Used by src/db/turso/bench.rs and any future `[[bench]]` targets.
criterion = "0.8.2"
